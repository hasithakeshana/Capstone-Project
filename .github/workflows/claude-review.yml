name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for a Claude key
        id: keys
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "Claude review skipped — no key configured yet"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Claude review
        id: claude
        if: steps.keys.outputs.has_key == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} for LearnLab.
            Review only its diff. Check it against CLAUDE.md (Review checklist), specs/app_spec.md,
            the relevant feature spec and specs/design/constitution.md.
            Report: spec mismatches, missing AC-tagged tests, layer violations, security or PII issues,
            project-rule breaks. Be concise. Post your review as one pull request comment;
            say 'No blocking issues' if none.
          claude_args: '--max-turns 10 --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
